[project]
name = "p2i-gan-benchmark"
version = "0.1.0"
description = "Rainfall field reconstruction from sparse rain gauges as video inpainting"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "h5py>=3.15",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1",
    "wandb>=0.28",
    "zarr>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]
experiments = [
    "scipy>=1.16",
]
tools = [
    "imageio>=2.37",
    "tqdm>=4.67",
]

[tool.uv]
default-groups = ["dev", "experiments", "tools"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["p2igan_bench*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs inference or training on the real data, preferably on a CUDA GPU"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["scripts/tools", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["B", "F841"]
